<nav class="navbar navbar-expand-lg border-bottom animate-fade-in">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center">
      <h4 class="welcome-text mb-0" *ngIf="currentUser">
        Bienvenue, <span class="role-text">{{ currentUser.prenom }}!</span>
      </h4>
    </div>

    <div class="ms-auto d-flex align-items-center gap-3">
      <!-- Notifications -->
      <div class="dropdown">
        <button class="nav-icon-btn d-flex align-items-center justify-content-center" id="notifDropdown" data-bs-toggle="dropdown">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" *ngIf="(unreadCount$ | async) || 0 > 0">{{ unreadCount$ | async }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end glass-card border-0 mt-3 p-2 shadow-lg" aria-labelledby="notifDropdown" style="width: 320px; max-height: 450px; overflow-y: auto;">
          <li>
            <div class="d-flex justify-content-between align-items-center px-3 py-2">
              <h6 class="dropdown-header font-montserrat fw-bold text-dark p-0 mb-0">Notifications</h6>
              <button class="btn btn-link btn-sm text-decoration-none p-0" (click)="markAllAsRead()" *ngIf="(unreadCount$ | async) || 0 > 0">
                Tout marquer lu
              </button>
            </div>
          </li>
          <li><hr class="dropdown-divider mt-1"></li>
          
          <ng-container *ngIf="(alertes$ | async)?.length; else noNotif">
            <li class="p-1" *ngFor="let alerte of alertes$ | async">
              <div class="dropdown-item rounded-3 p-3 border-bottom-0 notification-item animate-fade-in">
                <div class="d-flex align-items-start gap-3">
                  <div class="notif-icon-circle" [ngClass]="alerte.type">
                    <i class="fas" [ngClass]="getIconForType(alerte.type)"></i>
                  </div>
                  <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start">
                      <h6 class="fw-bold mb-1 small text-dark">{{ alerte.titre }}</h6>
                      <button class="btn-close ms-2" style="font-size: 0.5rem;" (click)="markAsRead(alerte.id, $event)"></button>
                    </div>
                    <p class="mb-1 text-muted small lh-sm">{{ alerte.description }}</p>
                    <span class="text-secondary" style="font-size: 0.65rem;">
                      <i class="far fa-clock me-1"></i> {{ alerte.dateCreation | date:'HH:mm' }}
                    </span>
                  </div>
                </div>
              </div>
            </li>
          </ng-container>

          <ng-template #noNotif>
            <li class="p-4 text-center">
              <div class="text-muted small">
                <i class="fas fa-bell-slash fa-2x mb-2 d-block opacity-25"></i>
                Aucune nouvelle notification
              </div>
            </li>
          </ng-template>
        </ul>
      </div>

      <!-- User Profile -->
      <div class="dropdown" *ngIf="currentUser">
        <button class="user-profile-btn d-flex align-items-center gap-3 border-0 text-decoration-none dropdown-toggle no-caret" id="userMenu" data-bs-toggle="dropdown">
          <div class="text-end d-none d-md-block">
            <div class="small fw-bold text-dark mb-0">{{ currentUser.prenom }} {{ currentUser.nom }}</div>
            <div class="text-muted" style="font-size: 0.75rem;">{{ currentUser.role | roleLabel }}</div>
          </div>
          <img [src]="currentUser.photoUrl || 'assets/images/default-avatar.png'" alt="avatar" class="avatar-img">
        </button>
        <ul class="dropdown-menu dropdown-menu-end glass-card border-0 mt-3 p-2 shadow-lg" aria-labelledby="userMenu">
          <li class="p-1"><a class="dropdown-item rounded-3 py-2" routerLink="/profil">
            <i class="fas fa-user-circle me-3 text-muted"></i> Mon Profil
          </a></li>
          <li class="p-1"><a class="dropdown-item rounded-3 py-2" routerLink="/profil" [queryParams]="{ tab: 'settings' }">
            <i class="fas fa-cog me-3 text-muted"></i> Paramètres
          </a></li>
          <li><hr class="dropdown-divider mx-2"></li>
          <li class="p-1"><a class="dropdown-item rounded-3 py-2 text-danger" href="javascript:void(0)" (click)="logout()">
            <i class="fas fa-sign-out-alt me-3"></i> Déconnexion
          </a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>
