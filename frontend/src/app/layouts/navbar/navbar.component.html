<nav class="navbar navbar-expand-lg border-bottom animate-fade-in">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center">
      <!-- Hamburger Menu Button (Mobile/Tablet only) -->
      <button class="hamburger-btn me-3" (click)="onToggleSidebar()" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
      <h4 class="welcome-text mb-0 d-none d-md-block" *ngIf="currentUser">
        Bienvenue, <span class="role-text">{{ currentUser.prenom }}!</span>
      </h4>
      <!-- Mobile: show only first name -->
      <span class="welcome-text-mobile d-md-none fw-bold color-marron" *ngIf="currentUser">
        {{ currentUser.prenom }}
      </span>
    </div>

    <div class="ms-auto d-flex align-items-center gap-2 gap-md-3">
      <!-- Notifications -->
      <div class="dropdown">
        <button class="nav-icon-btn d-flex align-items-center justify-content-center" id="notifDropdown" data-bs-toggle="dropdown">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" *ngIf="(unreadCount$ | async) || 0 > 0">{{ unreadCount$ | async }}</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end glass-card border-0 mt-3 p-0 shadow-lg notif-dropdown" aria-labelledby="notifDropdown">
          <!-- Header -->
          <div class="p-2 border-bottom bg-white" style="border-radius: 10px 10px 0 0;">
            <div class="d-flex justify-content-between align-items-center px-3 py-2">
              <h6 class="font-montserrat fw-bold text-dark mb-0">Notifications</h6>
              <button class="btn btn-link btn-sm text-decoration-none p-0" (click)="markAllAsRead()" *ngIf="(unreadCount$ | async) || 0 > 0">
                Tout marquer lu
              </button>
            </div>
          </div>
          
          <!-- Scrollable Body -->
          <div class="notification-scroll-container p-2" style="max-height: 400px; overflow-y: auto; overflow-x: hidden;">
            <ul class="list-unstyled mb-0">
              <ng-container *ngIf="(alertes$ | async)?.length; else noNotif">
                <li class="mb-2" *ngFor="let alerte of alertes$ | async">
                  <div class="dropdown-item rounded-3 p-3 notification-item animate-fade-in text-wrap" style="background: rgba(255,255,255,0.7);">
                    <div class="d-flex align-items-start gap-3">
                      <div class="notif-icon-circle shadow-sm" [ngClass]="alerte.type">
                        <i class="fas" [ngClass]="getIconForType(alerte.type)"></i>
                      </div>
                      <div class="flex-grow-1" style="min-width: 0;">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                          <h6 class="fw-bold mb-0 small text-dark pe-2 lh-sm">{{ alerte.titre }}</h6>
                          <button class="btn-close flex-shrink-0" style="font-size: 0.5rem; margin-top: 0.15rem;" (click)="markAsRead(alerte.id, $event)"></button>
                        </div>
                        <p class="mb-1 text-muted small lh-sm">{{ alerte.description }}</p>
                        <span class="text-secondary" style="font-size: 0.65rem;">
                          <i class="far fa-clock me-1"></i> {{ alerte.dateCreation | date:'HH:mm' }}
                        </span>
                      </div>
                    </div>
                  </div>
                </li>
              </ng-container>

              <ng-template #noNotif>
                <li class="p-4 text-center">
                  <div class="text-muted small">
                    <i class="fas fa-bell-slash fa-2x mb-2 d-block opacity-25"></i>
                    Aucune nouvelle notification
                  </div>
                </li>
              </ng-template>
            </ul>
          </div>
        </div>
      </div>

      <!-- User Profile -->
      <div class="dropdown" *ngIf="currentUser">
        <button class="user-profile-btn d-flex align-items-center gap-2 gap-md-3 border-0 text-decoration-none dropdown-toggle no-caret" id="userMenu" data-bs-toggle="dropdown">
          <div class="text-end d-none d-md-block">
            <div class="small fw-bold text-dark mb-0">{{ currentUser.prenom }} {{ currentUser.nom }}</div>
            <div class="text-muted" style="font-size: 0.75rem;">{{ currentUser.role | roleLabel }}</div>
          </div>
          <img [src]="currentUser.photoUrl || 'assets/images/default-avatar.png'" alt="avatar" class="avatar-img">
        </button>
        <ul class="dropdown-menu dropdown-menu-end glass-card border-0 mt-3 p-2 shadow-lg" aria-labelledby="userMenu">
          <li class="p-1"><a class="dropdown-item rounded-3 py-2" routerLink="/profil">
            <i class="fas fa-user-circle me-3 text-muted"></i> Mon Profil
          </a></li>
          <li class="p-1"><a class="dropdown-item rounded-3 py-2" routerLink="/profil" [queryParams]="{ tab: 'settings' }">
            <i class="fas fa-cog me-3 text-muted"></i> Paramètres
          </a></li>
          <li><hr class="dropdown-divider mx-2"></li>
          <li class="p-1"><a class="dropdown-item rounded-3 py-2 text-danger" href="javascript:void(0)" (click)="logout()">
            <i class="fas fa-sign-out-alt me-3"></i> Déconnexion
          </a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>
