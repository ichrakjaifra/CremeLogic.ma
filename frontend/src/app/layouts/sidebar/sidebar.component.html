<div class="sidebar d-flex flex-column flex-shrink-0 animate-fade-in">
  <div class="sidebar-header p-4 text-center">
    <a routerLink="/" class="text-decoration-none">
      <img src="assets/images/logo.png" alt="CrèmeLogic" class="sidebar-logo mb-2">
      <h5 class="text-white mb-0 font-montserrat fw-bold" style="letter-spacing: 2px;">CrèmeLogic</h5>
    </a>
  </div>
  
  <ul class="nav nav-pills flex-column mb-auto mt-2">
    <!-- Admin / Dashboard (Common for All but specific view) -->
    <li class="nav-item">
      <a [routerLink]="userDashboardRoute" routerLinkActive="active" class="nav-link">
        <i class="fas fa-th-large me-3"></i>
        <span>Tableau de Bord</span>
      </a>
    </li>

    <!-- User Management (Admin Only) -->
    <li *ngIf="userRole === 'ADMIN'">
      <a routerLink="/admin/utilisateurs" routerLinkActive="active" class="nav-link">
        <i class="fas fa-user-shield me-3"></i>
        <span>Utilisateurs</span>
      </a>
    </li>

    <!-- Production & Recipes (Admin, Chef, Employe-Read) -->
    <li *ngIf="['ADMIN', 'CHEF', 'EMPLOYE'].includes(userRole!)">
      <a routerLink="/chef/production" routerLinkActive="active" class="nav-link">
        <i class="fas fa-industry me-3"></i>
        <span>Production</span>
      </a>
    </li>
    <li *ngIf="['ADMIN', 'CHEF'].includes(userRole!)">
      <a routerLink="/chef/recettes" routerLinkActive="active" class="nav-link">
        <i class="fas fa-mortar-pestle me-3"></i>
        <span>Recettes</span>
      </a>
    </li>
    <li *ngIf="['ADMIN', 'CHEF'].includes(userRole!)">
      <a routerLink="/chef/produits" routerLinkActive="active" class="nav-link">
        <i class="fas fa-cookie-bite me-3"></i>
        <span>Vitrine & Produits</span>
      </a>
    </li>

    <!-- Stock & Suppliers (Admin, Magasinier, Chef Read) -->
    <li *ngIf="['ADMIN', 'MAGASINIER', 'CHEF'].includes(userRole!)">
      <a routerLink="/magasinier/ingredients" routerLinkActive="active" class="nav-link">
        <i class="fas fa-leaf me-3"></i>
        <span>Ingrédients</span>
      </a>
    </li>
    <li *ngIf="['ADMIN', 'MAGASINIER'].includes(userRole!)">
      <a routerLink="/magasinier/dashboard" routerLinkActive="active" class="nav-link">
        <i class="fas fa-boxes me-3"></i>
        <span>Stock / Dashboard</span>
      </a>
    </li>
    <li *ngIf="['ADMIN', 'MAGASINIER'].includes(userRole!)">
      <a routerLink="/magasinier/commandes-achat" routerLinkActive="active" class="nav-link">
        <i class="fas fa-file-invoice-dollar me-3"></i>
        <span>Commandes Achat</span>
      </a>
    </li>
    <li *ngIf="['ADMIN', 'MAGASINIER'].includes(userRole!)">
      <a routerLink="/magasinier/mouvements-stock" routerLinkActive="active" class="nav-link">
        <i class="fas fa-history me-3"></i>
        <span>Flux de Stock</span>
      </a>
    </li>
    <li *ngIf="['ADMIN', 'MAGASINIER'].includes(userRole!)">
      <a routerLink="/magasinier/fournisseurs" routerLinkActive="active" class="nav-link">
        <i class="fas fa-shuttle-van me-3"></i>
        <span>Fournisseurs</span>
      </a>
    </li>

    <!-- Sales & Tasks (Admin, Employé) -->
    <li *ngIf="['ADMIN', 'EMPLOYE'].includes(userRole!)">
      <a routerLink="/employe/ventes" routerLinkActive="active" class="nav-link">
        <i class="fas fa-cash-register me-3"></i>
        <span>Ventes</span>
      </a>
    </li>
    <!-- My Profile (All) -->
    <li>
      <a routerLink="/profil" routerLinkActive="active" class="nav-link">
        <i class="fas fa-user-circle me-3"></i>
        <span>Mon Profil</span>
      </a>
    </li>
  </ul>

  <div class="logout-container">
    <a (click)="logout()" class="logout-link text-decoration-none">
      <i class="fas fa-sign-out-alt me-3"></i>
      <span class="fw-bold">Déconnexion</span>
    </a>
  </div>
</div>
