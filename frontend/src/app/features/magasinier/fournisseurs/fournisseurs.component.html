<div class="suppliers-page p-2 animate-fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4 px-3">
    <div>
      <h2 class="fw-bold color-marron mb-0 font-montserrat">Partenaires & Fournisseurs</h2>
      <p class="text-muted small mb-0">Gérez vos relations avec vos fournisseurs de confiance.</p>
    </div>
    <button class="btn btn-primary-custom px-4 py-2 shadow-sm" (click)="openSupplierModal()">
      <i class="fas fa-plus me-2"></i> Ajouter un Partenaire
    </button>
  </div>

  <!-- Search & Stats -->
  <div class="glass-card mb-5 p-4">
    <div class="row align-items-center">
      <div class="col-md-7">
        <div class="input-group search-box">
          <span class="input-group-text bg-white border-0 ps-3 text-muted"><i class="fas fa-search"></i></span>
          <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="applySearch()" 
                 class="form-control border-0 py-2 shadow-none" placeholder="Rechercher par nom, ville ou spécialité...">
        </div>
      </div>
      <div class="col-md-5">
        <div class="d-flex justify-content-end gap-4 mt-3 mt-md-0">
          <div class="text-center">
            <div class="h4 fw-bold color-marron mb-0">{{ fournisseurs.length }}</div>
            <div class="extra-small text-muted fw-bold text-uppercase">Total</div>
          </div>
          <div class="text-center">
            <div class="h4 fw-bold text-success mb-0">{{ activeCount }}</div>
            <div class="extra-small text-muted fw-bold text-uppercase">Actifs</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Suppliers Grid -->
  <div class="row g-4 mb-5">
    <div class="col-md-6 col-lg-4" *ngFor="let s of filteredFournisseurs | paginate: { itemsPerPage: 6, currentPage: p }">
      <div class="glass-card supplier-card h-100 p-4 shadow-sm border-0 position-relative" [ngClass]="{'opacity-75': !s.actif}">
        <div class="d-flex align-items-start mb-4">
          <div class="supplier-icon bg-chocolate-light me-3">
            <i class="fas fa-building color-marron"></i>
          </div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between">
              <h5 class="fw-bold text-dark mb-1 font-montserrat">{{ s.nom }}</h5>
              <div class="form-check form-switch py-0">
                <input class="form-check-input custom-switch" type="checkbox" [checked]="s.actif" 
                       (change)="toggleStatus(s)">
              </div>
            </div>
            <div class="extra-small text-muted text-uppercase fw-bold"><i class="fas fa-map-marker-alt me-1"></i> {{ s.ville || 'Maroc' }}</div>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex align-items-center mb-2 small text-secondary">
            <i class="fas fa-phone-alt me-2 opacity-50"></i> {{ s.telephone || 'Non renseigné' }}
          </div>
          <div class="d-flex align-items-center small text-secondary">
            <i class="fas fa-envelope me-2 opacity-50"></i> {{ s.email || 'Pas d\'email' }}
          </div>
        </div>

        <div class="pt-3 border-top d-flex justify-content-between align-items-center">
          <span class="badge px-3 py-2 rounded-pill fw-bold" 
                [ngClass]="s.actif ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'">
            {{ s.actif ? 'ACTIF' : 'INACTIF' }}
          </span>
          <button class="btn btn-sm btn-outline-custom rounded-pill px-4 extra-small fw-bold" (click)="editSupplier(s)">
            GÉRER <i class="fas fa-chevron-right ms-1"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="col-12" *ngIf="filteredFournisseurs.length === 0">
      <div class="py-5">
        <app-empty-state title="Aucun fournisseur trouvé" 
                        description="Élargissez vos recherches ou créez une nouvelle fiche fournisseur."
                        icon="fas fa-truck-loading">
        </app-empty-state>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center pt-2" *ngIf="filteredFournisseurs.length > 0">
    <pagination-controls (pageChange)="p = $event" previousLabel="" nextLabel=""></pagination-controls>
  </div>
</div>
