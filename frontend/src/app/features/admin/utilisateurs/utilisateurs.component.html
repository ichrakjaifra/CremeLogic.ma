<div class="user-management p-2 animate-fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4 px-3">
    <div>
      <h2 class="fw-bold color-marron mb-0 font-montserrat">Gestion du Personnel</h2>
      <p class="text-muted small mb-0">Contrôlez les accès et les rôles de votre équipe.</p>
    </div>
    <button class="btn btn-primary-custom px-4 py-2 shadow-sm" (click)="openUserModal()">
      <i class="fas fa-user-plus me-2"></i> Nouvel Employé
    </button>
  </div>

  <!-- Filters -->
  <div class="glass-card mb-4 p-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label extra-small fw-bold text-uppercase color-marron opacity-75">Rechercher</label>
        <div class="input-group search-box">
          <span class="input-group-text bg-white border-0 ps-3 text-muted"><i class="fas fa-search"></i></span>
          <input type="text" [(ngModel)]="filter.keyword" (ngModelChange)="applyFilters()" 
                 class="form-control border-0 py-2 shadow-none" placeholder="Nom, email, téléphone...">
        </div>
      </div>
      <div class="col-md-3">
        <label class="form-label extra-small fw-bold text-uppercase color-marron opacity-75">Rôle</label>
        <select class="form-select border-0 py-2 shadow-sm" [(ngModel)]="filter.role" (change)="applyFilters()">
          <option value="">Tous les rôles</option>
          <option value="ADMIN">Administrateur</option>
          <option value="CHEF">Chef Pâtissier</option>
          <option value="MAGASINIER">Magasinier</option>
          <option value="EMPLOYE">Employé</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label extra-small fw-bold text-uppercase color-marron opacity-75">Statut</label>
        <select class="form-select border-0 py-2 shadow-sm" [(ngModel)]="filter.status" (change)="applyFilters()">
          <option value="">Tous</option>
          <option value="true">Actifs</option>
          <option value="false">Inactifs</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-custom w-100 py-2 border-0" (click)="resetFilters()">
          <i class="fas fa-undo me-2"></i> Reset
        </button>
      </div>
    </div>
  </div>

  <!-- User List -->
  <div class="glass-card p-0 overflow-hidden shadow-lg border-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 custom-table">
        <thead>
          <tr>
            <th class="ps-4">Personnel</th>
            <th>Rôle</th>
            <th>Contact</th>
            <th>Statut</th>
            <th class="text-end pe-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of filteredUsers | paginate: { itemsPerPage: 10, currentPage: p }">
            <td class="ps-4">
              <div class="d-flex align-items-center">
                <div class="position-relative me-3">
                  <img [src]="user.photoUrl || 'assets/images/default-avatar.png'" class="avatar-img rounded-circle border" width="45" height="45">
                  <span class="status-indicator" [ngClass]="user.actif ? 'bg-success' : 'bg-danger'"></span>
                </div>
                <div>
                  <div class="fw-bold text-dark">{{ user.prenom }} {{ user.nom }}</div>
                  <div class="extra-small text-muted">{{ user.email }}</div>
                </div>
              </div>
            </td>
            <td>
              <span class="badge border text-dark fw-bold px-3 py-2 role-badge" 
                    [ngClass]="{
                      'bg-gold-light color-dore': user.role === 'ADMIN',
                      'bg-chocolate-light color-marron': user.role === 'CHEF',
                      'bg-beige-creme text-secondary': user.role !== 'ADMIN' && user.role !== 'CHEF'
                    }">
                {{ user.role | roleLabel }}
              </span>
            </td>
            <td>
              <div class="small fw-medium text-secondary">
                <i class="fas fa-phone-alt me-2 opacity-50"></i> {{ user.telephone || '-' }}
              </div>
            </td>
            <td>
              <div class="form-check form-switch py-0">
                <input class="form-check-input custom-switch" type="checkbox" [checked]="user.actif" 
                       (change)="toggleUserStatus(user)">
              </div>
            </td>
            <td class="text-end pe-4">
              <div class="d-flex justify-content-end gap-2">
                <button class="btn-action edit" (click)="editUser(user)" title="Modifier">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn-action key" (click)="resetPassword(user)" title="Réinitialiser MDP">
                  <i class="fas fa-key"></i>
                </button>
                <button class="btn-action delete" [appConfirm]="'Voulez-vous vraiment supprimer cet utilisateur ?'" 
                        (confirmed)="deleteUser(user)" title="Supprimer">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="filteredUsers.length === 0">
            <td colspan="5" class="py-5">
              <app-empty-state title="Aucun membre trouvé" 
                              description="Ajustez vos filtres pour voir plus de personnel."
                              icon="fas fa-users-slash">
              </app-empty-state>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="p-3 d-flex justify-content-center border-top bg-light bg-opacity-10" *ngIf="filteredUsers.length > 0">
      <pagination-controls (pageChange)="p = $event" previousLabel="" nextLabel=""></pagination-controls>
    </div>
  </div>
</div>

<app-user-form-modal #userModal (userSaved)="loadUsers()"></app-user-form-modal>
