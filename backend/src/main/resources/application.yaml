server:
  port: 8081
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/json

spring:
  application:
    name: CremeLogic
    version: 1.0.0

  profiles:
    active: ${ACTIVE_PROFILE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Africa/Casablanca
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    com.cremelogic: DEBUG
    org.springframework: INFO
    org.hibernate: WARN