# ============================================
# 🧁 CrèmeLogic - Pipeline CI/CD
# ============================================

name: CrèmeLogic CI/CD

on:
  push:
    branches: [ "master", "main", "dev-ichrak" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # --- CI Backend (Java/Maven) ---
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Exécution des tests unitaires
      # Les tests utilisent H2 en mémoire comme configuré dans src/test/resources
      run: mvn test

    - name: Build du package JAR
      run: mvn clean package -DskipTests

    - name: Archivage des rapports de test
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-reports
        path: backend/target/surefire-reports/

  # --- CI Frontend (Angular/Node) ---
  frontend-ci:
    name: Frontend CI (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Installation des dépendances
      run: npm ci --legacy-peer-deps

    - name: Exécution des tests unitaires (Headless)
      run: npm test -- --watch=false --browsers=ChromeHeadless

    - name: Build de production
      run: npm run build -- --configuration production

    - name: Archivage du build frontend
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/frontend/browser
